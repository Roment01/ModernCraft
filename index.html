<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ModernCraft</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#87CEEB">

  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #87CEEB;
      font-family: Arial, sans-serif;
    }

    #loading {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: #222;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.5s ease;
    }

    #menu {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 100;
    }

    #changelog {
      margin-top: 5px;
      font-size: 12px;
      opacity: 0.9;
    }

    #resetBtn {
      margin-top: 8px;
      padding: 5px 10px;
      background: #ff4d4d;
      border: none;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    #resetBtn:active {
      background: #cc0000;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* Экранные кнопки для мобильных */
    .touch-controls {
      position: fixed;
      bottom: 20px;
      left: 0;
      width: 100%;
      height: 100px;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 200;
      pointer-events: none;
    }

    .d-pad, .action-pad {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .btn {
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      color: white;
      font-size: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(4px);
    }

    .btn:active {
      background: rgba(255, 255, 255, 0.6);
    }

    /* Плашка установки PWA */
    #pwaInstallBanner {
      position: fixed;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(34, 34, 34, 0.95);
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      display: none;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      z-index: 500;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    #pwaInstallBanner button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    #pwaInstallBanner .close-btn {
      background: transparent;
      color: #aaa;
      font-size: 16px;
      padding: 4px;
    }
  </style>
</head>
<body>
  <!-- Загрузочный экран -->
  <div id="loading">
    <h1>ModernCraft</h1>
    <p id="versionText">Загрузка...</p>
  </div>

  <!-- Меню с информацией -->
  <div id="menu">
    <div id="versionUI">Версия игры: --</div>
    <div id="changelog">Что нового: --</div>
    <button id="resetBtn">Сбросить мир</button>
  </div>

  <!-- Баннер установки PWA -->
  <div id="pwaInstallBanner">
    <span>Установить ModernCraft как приложение?</span>
    <button id="pwaInstallBtn">Установить</button>
    <button class="close-btn" id="pwaCloseBtn">✕</button>
  </div>

  <!-- Экранное управление -->
  <div class="touch-controls">
    <div class="d-pad">
      <div class="btn" id="btnLeft">◄</div>
      <div class="btn" id="btnRight">►</div>
    </div>
    <div class="action-pad">
      <div class="btn" id="btnJump">▲</div>
    </div>
  </div>

  <!-- Игровой холст -->
  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const blockSize = 40;
    let cols = 0;
    let rows = 0;
    let world = [];

    const SAVE_KEY = 'moderncraft_world_save';

    // Сохранение мира в LocalStorage
    function saveWorld() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(world));
      } catch (e) {
        console.error('Ошибка сохранения мира:', e);
      }
    }

    // Загрузка мира из LocalStorage
    function loadWorld() {
      try {
        const savedData = localStorage.getItem(SAVE_KEY);
        if (savedData) {
          return JSON.parse(savedData);
        }
      } catch (e) {
        console.error('Ошибка загрузки сохранения:', e);
      }
      return null;
    }

    // Инициализация или генерация нового мира
    function initWorld() {
      cols = Math.ceil(canvas.width / blockSize);
      rows = Math.ceil(canvas.height / blockSize);

      const savedWorld = loadWorld();

      if (savedWorld && savedWorld.length > 0) {
        world = savedWorld;
      } else {
        world = [];
        for (let y = 0; y < rows; y++) {
          world[y] = [];
          for (let x = 0; x < cols; x++) {
            world[y][x] = y > Math.floor(rows / 2) ? 1 : 0;
          }
        }
        saveWorld();
      }
    }

    // Сброс сохранения
    document.getElementById('resetBtn').addEventListener('click', () => {
      if (confirm('Вы уверены, что хотите сбросить сохраненный мир?')) {
        localStorage.removeItem(SAVE_KEY);
        world = [];
        initWorld();
      }
    });

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      if (world.length === 0) {
        initWorld();
      }
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Загрузка конфигов
    function loadJSON(url, fallback) {
      return fetch(url)
        .then(r => r.ok ? r.json() : fallback)
        .catch(() => fallback);
    }

    Promise.all([
      loadJSON('version.json', { version: '0.2.0', build: '2' }),
      loadJSON('changelog.json', { items: [{ text: 'Поддержка установки приложения (PWA)' }] })
    ]).then(([v, c]) => {
      document.getElementById('versionText').textContent = `Версия ${v.version} | Build ${v.build}`;
      document.getElementById('versionUI').textContent = `Версия игры: ${v.version}`;
      document.getElementById('changelog').textContent = `Что нового: ${c.items[0].text}`;
    });

    // Игрок
    const player = {
      x: 3,
      y: 2,
      vx: 0,
      vy: 0,
      width: 0.8,
      height: 0.9,
      onGround: false
    };

    const gravity = 0.35;
    const keys = {};

    document.addEventListener('keydown', e => keys[e.code] = true);
    document.addEventListener('keyup', e => keys[e.code] = false);

    // Сенсорное управление
    function bindTouch(elementId, code) {
      const btn = document.getElementById(elementId);
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[code] = true; });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[code] = false; });
    }
    bindTouch('btnLeft', 'KeyA');
    bindTouch('btnRight', 'KeyD');
    bindTouch('btnJump', 'Space');

    // Проверка физических блоков
    function isSolid(x, y) {
      const bx = Math.floor(x);
      const by = Math.floor(y);
      if (by < 0) return false;
      if (!world[by] || world[by][bx] === undefined) return true;
      return world[by][bx] === 1;
    }

    // Строительство / разрушение
    canvas.addEventListener('click', e => interactWorld(e, 1));
    canvas.addEventListener('contextmenu', e => {
      e.preventDefault();
      interactWorld(e, 0);
    });

    function interactWorld(e, blockType) {
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor((e.clientX - rect.left) / blockSize);
      const y = Math.floor((e.clientY - rect.top) / blockSize);
      if (world[y] && world[y][x] !== undefined) {
        world[y][x] = blockType;
        saveWorld();
      }
    }

    // Игровой цикл
    function update() {
      player.vx = 0;
      if (keys['ArrowLeft'] || keys['KeyA']) player.vx = -0.12;
      if (keys['ArrowRight'] || keys['KeyD']) player.vx = 0.12;

      if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.onGround) {
        player.vy = -0.32;
        player.onGround = false;
      }

      player.vy += gravity * 0.05;

      player.x += player.vx;
      if (isSolid(player.x, player.y) || isSolid(player.x + player.width, player.y)) {
        player.x -= player.vx;
      }

      player.y += player.vy;
      if (isSolid(player.x, player.y + player.height) || isSolid(player.x + player.width, player.y + player.height)) {
        player.y = Math.floor(player.y + player.height) - player.height;
        player.vy = 0;
        player.onGround = true;
      } else {
        player.onGround = false;
      }

      draw();
      requestAnimationFrame(update);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          if (world[y] && world[y][x] === 1) {
            ctx.fillStyle = '#6b4f2a';
            ctx.fillRect(x * blockSize, y * blockSize, blockSize, blockSize);

            if (y > 0 && world[y - 1] && world[y - 1][x] === 0) {
              ctx.fillStyle = '#4CAF50';
              ctx.fillRect(x * blockSize, y * blockSize, blockSize, 6);
            }
          }
        }
      }

      ctx.fillStyle = '#E91E63';
      ctx.fillRect(
        player.x * blockSize,
        player.y * blockSize,
        player.width * blockSize,
        player.height * blockSize
      );
    }

    setTimeout(() => {
      const loader = document.getElementById('loading');
      loader.style.opacity = '0';
      setTimeout(() => loader.style.display = 'none', 500);
      update();
    }, 800);

    // ====================== ЛОГИКА PWA УСТАНОВКИ ======================
    let deferredPrompt;
    const pwaBanner = document.getElementById('pwaInstallBanner');
    const pwaBtn = document.getElementById('pwaInstallBtn');
    const pwaCloseBtn = document.getElementById('pwaCloseBtn');

    // Перехватываем событие предложения установки
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // Показываем плашку предложения установки
      pwaBanner.style.display = 'flex';
    });

    pwaBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      pwaBanner.style.display = 'none';
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      console.log(`Результат установки: ${outcome}`);
      deferredPrompt = null;
    });

    pwaCloseBtn.addEventListener('click', () => {
      pwaBanner.style.display = 'none';
    });

    // Регистрация Service Worker с версией v=2 для обновления кэша
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js?v=2')
          .then(reg => console.log('✅ Service Worker зарегистрирован'))
          .catch(err => console.error('❌ Ошибка SW:', err));
      });
    }
  </script>
</body>
</html>
